# KneadData-only local-SSD test. These selections are already the profile defaults.
# bash dxbuild.sh --profile dnanexus_dxfuse --refresh-images
# Upload/select this YAML and your own samplesheet when launching the applet.
workflow: mgx
outdir: results
run_qc: true
stop_after_qc: false
run_taxonomic_profiling: false
run_functional_profiling: false
run_viral_profiling: false
run_strain_profiling: false
run_vis: false
run_stats: false
log_versions: false

# Default: references in the job's project, inside /Databases.
# Uncomment/edit for a separate reference project or a different project folder.
# dnanexus_reference_project: project-REPLACE
# dnanexus_reference_folder: /Databases
# Project-to-worker download is the default. For direct FUSE comparison:
# dnanexus_reference_mode: fuse

# Downloaded folders are mounted read-only inside the container as /Databases.
# The profile already selects the KneadData path. Other stages are disabled.
# host_genome: /Databases/kneaddata
