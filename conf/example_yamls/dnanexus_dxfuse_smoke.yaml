# Upload and select this parameter YAML with your own small samplesheet.
# Build with: bash dxbuild.sh --profile dnanexus_dxfuse --refresh-images
workflow: mgx
outdir: results
run_qc: true
stop_after_qc: false
run_taxonomic_profiling: false
run_functional_profiling: false
run_viral_profiling: false
run_strain_profiling: false
run_vis: false
run_stats: false
log_versions: false

# Defaults mount /Databases from the worker's project. To use another project:
# dnanexus_reference_project: project-REPLACE
# dnanexus_reference_folder: /Databases
# host_genome: /Databases/kneaddata
