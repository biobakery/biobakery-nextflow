# What can be checked without the bioBakery tool stack.
#
# The integration suite (tests/run_tests.sh) needs KneadData, MetaPhlAn, HUMAnN,
# the reference databases and a SLURM cluster, so it cannot run here; see
# tests/README.md. What runs here instead is bin/make_diagrams.py --check, which
# rebuilds every workflow's DAG with `nextflow run -preview`. -preview resolves
# the configuration and builds the graph without launching a task, so it needs
# only Nextflow and a JVM -- and it still catches a config that does not parse,
# a broken include, a channel wired to nothing, and a docs/ page that has
# drifted from the code.

name: CI

on: [push, pull_request]

jobs:
  graph:
    name: Workflow graphs and docs are current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '24.10.4'

      - name: Check every profile parses and preserves resource requests
        run: bin/check_profile_resources.py

      - name: Check site parameter examples and override precedence
        run: python3 -m unittest discover -s tests -p test_site_configs.py

      - name: Validate tool/database compatibility resource
        run: |
          python -m pip install -r tests/compatibility/requirements.txt
          python -m unittest discover -s tests/compatibility -p 'test_*.py'

      - name: Check the diagrams and the step reference are up to date
        run: bin/make_diagrams.py --check
